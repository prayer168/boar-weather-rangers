function renderPanels(){let P=$('#panels');P.innerHTML=tr('tabs').map((_,i)=>`<section id="panel${i}" class="panel ${state.tab===i?'active':''}" role="tabpanel"></section>`).join('');P.querySelector('#panel0').innerHTML=homeHTML();for(let i=1;i<=3;i++)P.querySelector(`#panel${i}`).innerHTML=gameHTML(i-1);P.querySelector('#panel4').innerHTML=principleHTML();P.querySelector('#panel5').innerHTML=lifeHTML();P.querySelector('#panel6').innerHTML=quizHTML();P.querySelector('#panel7').innerHTML=resourcesHTML();bind()}
function homeHTML(){let t=tr('tabs');return `<div class="hero"><div><span class="eyebrow">${tr('heroK')}</span><h2>${tr('heroTitle')}</h2><p>${tr('heroText')}</p><div class="row"><button class="btn light" data-action="start">${tr('start')} ↗</button><span class="badge">${tr('grade')}</span><span class="badge gold">◷ ${tr('time')}</span></div></div><div class="hero-art" aria-hidden="true">🐗</div></div><div class="section-head"><div><h2>${tr('flowTitle')}</h2><p>${tr('flowSub')}</p></div></div><div class="steps">${tr('flow').map((x,i)=>`<div class="step"><span class="num">${i+1}</span><b>${['01','02','03'][i]}</b><p>${x}</p></div>`).join('')}</div><div class="section-head"><div><h2>${tr('levelsTitle')}</h2><p>${tr('levelsSub')}</p></div><span class="badge">${state.score} ${tr('scoreWord')}</span></div><div class="level-row">${levels.map(i=>{let unlock=i===0||state.complete[i-1], done=state.complete[i];return `<article class="level-card ${unlock?'':'locked'}"><span class="badge ${done?'':'gold'}">${done?tr('done'):unlock?tr('open'):tr('locked')}</span><h3>${i+1}. ${tr('levelNames')[i]}</h3><p>${tr('levelDescs')[i]}</p><button class="btn small ${unlock?'':'ghost'}" data-action="level" data-level="${i}" ${unlock?'':'disabled'}>${tr('play')} →</button></article>`}).join('')}</div><div class="layout"><article class="card"><h3>${tr('teacherNote')}</h3><p>${tr('physics')}</p><p>${tr('sensory')}</p></article><article class="card"><h3>🔎 ${tr('truthNote')}</h3><p>${tr('factorNote')}</p><p>${tr('climateNote')}</p></article></div>`}
function gameHTML(i){let m=missions[i];return `<div class="game-head"><div><span class="eyebrow">${tr('gameEyebrow')} · ${tr('stage')} ${i+1}/3</span><h2>${tr('levelNames')[i]}</h2><p>${tr('task'+(i+1))}</p></div><div class="hud"><span class="meter-label">${tr('score')} ${state.score}</span><span class="meter"><span style="width:${state.complete[i]?100:state.reached?66:24}%"></span></span><button class="btn ghost small" data-action="reset" data-level="${i}">↻ ${tr('reset')}</button><button class="btn ghost small" data-action="help">? ${tr('help')}</button></div></div><div class="game-grid"><article class="card map-card"><div class="map-wrap">${mapSVG(i)}</div><div class="map-legend"><span><i class="legend-dot" style="background:#dc9142"></i>${tr('probe')}</span><span><i class="legend-dot" style="background:#3d75a1"></i>${tr('recoil')}</span><span>🟨 ${tr('target')}</span><span>🐗 ${tr('you')}</span></div><div class="controls" aria-label="${tr('move')}"><span></span><button data-dir="0" aria-label="Northwest">↖</button><button data-dir="1" aria-label="North">↑</button><button data-dir="5" aria-label="Southwest">↙</button><button data-dir="4" aria-label="South">↓</button><button data-dir="3" aria-label="Southeast">↘</button></div><div class="row" style="justify-content:center"><button class="btn" data-action="launch" ${state.reached||state.complete[i]?'disabled':''}>➤ ${tr('launch')}</button><span class="meter-label">${tr('shots')}: ${state.shots}</span></div><div class="feedback" role="status">${state.feedback||tr('mapHint')}</div></article><aside class="aside">${!state.reached&&!state.complete[i]?`<article class="inset"><h3>🔮 ${tr('predict')}</h3><p>${tr('forecastPrompt')}</p>${tr('forecastOptions').map((x,n)=>`<button class="answer ${state.prediction===n?'correct':''}" data-pred="${n}">${x}</button>`).join('')}</article>`:''}${state.reached||state.complete[i]?observationHTML(i):''}<article class="inset"><h3>📚 ${tr('lessonTitle')}</h3><p>${tr(['factorNote','forecastNote','climateNote'][i])}</p>${i===2?`<div class="badge gold">${tr('demo')}</div>`:''}</article><article class="inset"><h3>🧭 ${tr('teacherNote')}</h3><p>${tr('physics')}</p></article></aside></div>`}
function mapSVG(i){let m=missions[i],pos=state.pos, cells=[];for(let r=0;r<6;r++)for(let q=0;q<7;q++)cells.push([q,r]);let shot=trace(pos,state.dir,7),recoil=trace(pos,(state.dir+3)%6,2);let s=`<svg class="map" viewBox="0 0 620 420" role="img" aria-label="${tr('levelNames')[i]} ${tr('stationTitle')}"><defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#50836b" opacity=".12"/></pattern></defs><rect width="620" height="420" fill="url(#dots)"/>`;
cells.forEach(([q,r])=>{let x=40+q*78+(r%2)*39,y=43+r*62;let cls=(q===m.target[0]&&r===m.target[1])?'target':(q===3&&r===2||q===4&&r===4)?'block':(q===1&&r===4||q===5&&r===5)?'water':(q===3&&r===4||q===4&&r===1)?'ridge':'forest';if(state.reached&&(q===m.target[0]&&r===m.target[1]))cls+=' visited';if(q===pos[0]&&r===pos[1])cls+=' selected';s+=`<polygon class="hex ${cls}" points="${hexPts(x,y)}" data-q="${q}" data-r="${r}"/>`;let icon=q===m.target[0]&&r===m.target[1]?tr('targetHex'):q===pos[0]&&r===pos[1]?tr('youHex'):cls.includes('block')?'🪨':cls.includes('water')?'💧':cls.includes('ridge')?'⛰️':'🌲';s+=`<text class="hextext" x="${x}" y="${y+1}">${icon}</text>`;});
function polyTrace(points,color){if(points.length<2)return'';return `<polyline class="${color}" points="${points.map(([q,r])=>`${40+q*78+(r%2)*39},${43+r*62}`).join(' ')}`+(color==='path-shot'?`" marker-end="url(#arrowShot)"`: '">')+`/>`}
s+=`<defs><marker id="arrowShot" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc9142"/></marker></defs>${!state.reached?polyTrace(shot,'path-shot')+polyTrace(recoil,'path-recoil'):''}<text class="map-label" x="18" y="22">${tr('wind')}: ${i===1?tr('northEast'):'↗ NE'} · ${tr('terrain')}: 🌲　${tr('rock')}: 🪨　${tr('water')}: 💧</text></svg>`;return s}
function hexPts(x,y){return [[x-23,y],[x-12,y-21],[x+12,y-21],[x+23,y],[x+12,y+21],[x-12,y+21]].map(p=>p.join(',')).join(' ')}
function trace(from,d,n){let out=[from.slice()],p=from.slice();for(let j=0;j<n;j++){let [dq,dr]=dirs[d];p=[p[0]+dq,p[1]+dr];if(p[0]<0||p[0]>6||p[1]<0||p[1]>5||((p[0]===3&&p[1]===2)||(p[0]===4&&p[1]===4)))break;out.push(p.slice())}return out}
function observationHTML(i){if(i===0)return `<article class="inset"><h3>☁️ ${tr('dataTitle')}</h3><div class="data-list">${tr('dataLabels').map((x,n)=>`<div class="data-cell"><span>${x}</span><b>${['23 °C',tr('cloudy'),tr('northEast'),'12 km/h',tr('rain')][n]}</b></div>`).join('')}</div><div class="question">${tr('q1')}</div>${tr('opts1').map((x,n)=>`<button class="answer ${answerClass(i,n)}" data-answer="${n}">${x}</button>`).join('')}${answerExplain(i)}</article>`;
if(i===1)return `<article class="inset"><h3>📈 ${tr('task2Title')}</h3><div class="data-list">${tr('times').map((x,n)=>`<div class="data-cell"><span>${x}</span><b>${tr('temps')[n]}</b><span>☁️ ${tr('clouds')[n]} · ${tr('winds')[n]}</span></div>`).join('')}</div><div class="question">${tr('q2')}</div>${tr('opts2').map((x,n)=>`<button class="answer ${answerClass(i,n)}" data-answer="${n}">${x}</button>`).join('')}${answerExplain(i)}</article>`;
return `<article class="inset"><h3>🌍 ${tr('task3Title')}</h3><span class="badge gold">${tr('demo')}</span><div class="chart" aria-label="${tr('avgTemp')}">${[22.1,22.3,22.7,23.0,23.4].map((v,n)=>`<div class="bar-col"><b>${v.toFixed(1)}°</b><div class="bar" style="height:${45+(v-22)*42}px"></div><span>${tr('years')[n]}</span></div>`).join('')}</div><p class="meter-label">${tr('avgTemp')}</p><div class="question">${tr('q3')}</div>${tr('opts3').map((x,n)=>`<button class="answer ${answerClass(i,n)}" data-answer="${n}">${x}</button>`).join('')}${answerExplain(i)}</article>`}
function answerClass(i,n){return state.answer===null?'':n===[1,0,1][i]?'correct':state.answer===n?'wrong':''}
function answerExplain(i){if(state.answer===null)return `<div class="explain">${tr('why')}</div>`;let good=state.answer===[1,0,1][i];return `<div class="feedback">${good?tr('qDone'):tr('qTry')}<br>${tr(['answer1','answer2','answer3'][i])}</div><div class="row" style="margin-top:10px">${!state.complete[i]?`<button class="btn small" data-action="complete" data-level="${i}">${tr(i<2?'next':'complete')} →</button>`:`<button class="btn ghost small" data-action="reset" data-level="${i}">↻ ${tr('retry')}</button>`}${state.reason?`<span class="badge">${tr('reasonSaved')}</span>`:''}</div><div style="margin-top:10px"><div class="question">${tr('evidenceTitle')}</div><p class="meter-label">${tr('reasonPrompt')}</p><textarea data-reason placeholder="${tr('reasonPlaceholder')}" style="width:100%;min-height:65px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit">${state.reason}</textarea><button class="btn ghost small" data-action="saveReason" style="margin-top:7px">${tr('submitReason')}</button></div>`}
function principleHTML(){return `<div class="section-head"><div><span class="eyebrow">${tr('tabs')[4]}</span><h2>${tr('principleTitle')}</h2></div></div><div class="concept-grid">${tr('principles').map(([a,b,c])=>`<article class="card"><div class="mini-visual" role="img" aria-label="${a}">${c}</div><h3>${a}</h3><p>${b}</p></article>`).join('')}</div><div class="layout"><article class="card"><h3>${tr('weatherClimate')}</h3><p><b>☁️ ${tr('dataLabels')[1]} / Weather</b><br>${tr('weatherText')}</p><p><b>🌍 ${tr('dataLabels')[0]} / Climate</b><br>${tr('climateText')}</p></article><article class="card"><h3>↔️ ${tr('teacherNote')}</h3><p>${tr('physics')}</p></article></div>`}
function lifeHTML(){return `<div class="section-head"><div><span class="eyebrow">${tr('tabs')[5]}</span><h2>${tr('lifeTitle')}</h2></div></div><div class="concept-grid">${tr('lifeItems').map(([a,b,c])=>`<article class="card"><div class="mini-visual" role="img" aria-label="${a}">${c}</div><h3>${a}</h3><p>${b}</p><p><b>${tr('why')}</b></p></article>`).join('')}</div><div class="card" style="margin-top:14px"><b>🐗 ${tr('sensory')}</b></div>`}
function quizHTML(){let qs=tr('quizQs'),opts=tr('quizOpts');return `<div class="section-head"><div><span class="eyebrow">${tr('tabs')[6]}</span><h2>${tr('quizTitle')}</h2><p>${tr('quizIntro')}</p></div><span class="badge">${state.score} ${tr('scoreWord')}</span></div><div class="concept-grid">${qs.map((q,i)=>`<article class="card"><h3>${i+1}. ${q}</h3>${opts[i].map((x,n)=>`<button class="answer ${state.quizDone?'':''}" data-quiz="${i}" data-opt="${n}">${x}</button>`).join('')}<div class="explain" id="quizfb${i}"></div></article>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn ghost" data-action="resetQuiz">↻ ${tr('retry')}</button></div>`}
function resourcesHTML(){return `<div class="section-head"><div><span class="eyebrow">${tr('tabs')[7]}</span><h2>${tr('resourcesTitle')}</h2><p>${tr('resourcesIntro')}</p></div></div><div class="resource-list">${tr('resources').map(([a,b,c])=>`<article class="card resource"><span class="badge">🌐 ${state.lang==='ko'?'공식 자료':state.lang==='en'?'Official resource':'官方資源'}</span><h3>${a}</h3><p>${c}</p><a href="${b}" target="_blank" rel="noopener">${state.lang==='ko'?'자료 열기 ↗':state.lang==='en'?'Open resource ↗':'開啟資源 ↗'}</a></article>`).join('')}</div>`}
function bind(){ $$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));$$('[data-dir]').forEach(b=>b.onclick=()=>{state.dir=+b.dataset.dir;renderPanels()});$$('[data-pred]').forEach(b=>b.onclick=()=>{state.prediction=+b.dataset.pred;renderPanels()});$$('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));$$('[data-quiz]').forEach(b=>b.onclick=()=>quiz(+b.dataset.quiz,+b.dataset.opt));$$('[data-reason]').forEach(e=>e.oninput=()=>state.reason=e.value);$('#panels').querySelectorAll('.hex').forEach(h=>h.onclick=()=>{let q=+h.dataset.q,r=+h.dataset.r;let m=missions[state.tab-1];if(q===m.target[0]&&r===m.target[1]){state.dir=directionToward(state.pos,m.target);renderPanels()}else{let best=0,dist=99;dirs.forEach(([dq,dr],i)=>{let nd=Math.abs(q-(state.pos[0]+dq))+Math.abs(r-(state.pos[1]+dr));if(nd<dist){dist=nd;best=i}});state.dir=best;renderPanels()}})}
function directionToward(a,b){let best=0,dist=1e9;dirs.forEach(([dq,dr],i)=>{let x=a[0]+dq,y=a[1]+dr,d=Math.abs(b[0]-x)+Math.abs(b[1]-y);if(d<dist){dist=d;best=i}});return best}
function action(a,b){if(a==='start'){goLevel(0)}if(a==='level')goLevel(+b.dataset.level);if(a==='reset')resetLevel(+b.dataset.level);if(a==='launch')launch();if(a==='help')help();if(a==='complete'){let i=+b.dataset.level;state.complete[i]=true;state.score=Math.max(state.score,state.complete.filter(Boolean).length);if(i<2){goLevel(i+1)}else{state.tab=0;render();toast(tr('allDone'))}}if(a==='saveReason'){let box=$('[data-reason]');state.reason=box?.value||state.reason;toast(tr('reasonSaved'));renderPanels()}if(a==='resetQuiz'){state.quizDone=false;state.quizAnswered={};$$('[id^="quizfb"]').forEach(x=>x.textContent='');}}
function goLevel(i){if(i>0&&!state.complete[i-1])return;state.tab=i+1;resetLevel(i,false);render();window.scrollTo({top:0,behavior:'smooth'})}
function resetLevel(i,show=true){let m=missions[i];state.level=i;state.pos=m.start.slice();state.dir=0;state.shots=0;state.reached=false;state.answer=null;state.prediction=-1;state.feedback='';state.reason='';if(show){state.tab=i+1;render()}}
function launch(){let i=state.tab-1,m=missions[i];if(state.reached||state.complete[i]){toast(tr('already'));return}if(state.prediction<0){toast(tr('forecastPrompt'));return}state.shots++;let probe=trace(state.pos,state.dir,7).at(-1),back=(state.dir+3)%6,recoil=trace(state.pos,back,2).at(-1);state.pos=recoil;let windBoost=i===1?0:0;let d=Math.abs(probe[0]-m.target[0])+Math.abs(probe[1]-m.target[1]);let onTarget=probe[0]===m.target[0]&&probe[1]===m.target[1];if(onTarget){state.reached=true;state.feedback=tr('reachFeedback')}else if(recoil[0]===m.start[0]&&recoil[1]===m.start[1])state.feedback=tr('noRecoil');else state.feedback=tr('missFeedback');renderPanels()}
function answer(n){let i=state.tab-1;state.answer=n;if(n===[1,0,1][i]){state.score=Math.max(state.score,state.complete.filter(Boolean).length+1);toast(tr('badgeEarn'))}renderPanels()}
function quiz(i,n){state.quizAnswered=state.quizAnswered||{};state.quizAnswered[i]=n;let good=n===tr('quizAnswers')[i];let fb=$(`#quizfb${i}`);if(fb)fb.innerHTML=`<div class="feedback">${good?tr('qDone'):tr('qTry')} ${tr('why')}</div>`;let btn=$(`[data-quiz="${i}"][data-opt="${n}"]`);if(btn)btn.classList.add(good?'correct':'wrong');if(good&&!state.quizDone){state.quizDone=true;state.score++}}
function help(){let t=tr('tabs');$('#modalRoot').innerHTML=`<div class="modal-back" role="dialog" aria-modal="true"><article class="modal"><span class="eyebrow">${tr('help')}</span><h2>${tr('howTitle')}</h2><p>${tr('howText')}</p><p>${tr('physics')}</p><button class="btn" data-close>${tr('close')}</button></article></div>`;$('#modalRoot').querySelector('[data-close]').onclick=()=>$('#modalRoot').innerHTML='';$('#modalRoot').querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))$('#modalRoot').innerHTML=''}}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
$('#language').addEventListener('change',e=>setLang(e.target.value));$('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce');$('#motionBtn').setAttribute('aria-pressed',document.body.classList.contains('reduce'))};
window.addEventListener('keydown',e=>{if(![37,38,39,40,13].includes(e.keyCode)&&!['w','a','s','d','W','A','S','D'].includes(e.key))return;if(state.tab<1||state.tab>3)return;if(e.key==='Enter'||e.keyCode===13){e.preventDefault();launch();return}let k=e.key.toLowerCase(),map={a:0,w:1,d:2,s:4};if(k in map)state.dir=map[k];else if(e.keyCode===37)state.dir=0;else if(e.keyCode===38)state.dir=1;else if(e.keyCode===39)state.dir=3;else if(e.keyCode===40)state.dir=4;renderPanels()});
render();
</script></body></html>
